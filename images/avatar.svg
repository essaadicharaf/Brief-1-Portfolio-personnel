<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <!-- تدرج الخلفية الدائرية -->
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- هالة زرقاء متناسقة مع لون الموقع الرئيسي -->
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- تدرج لون البشرة -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8c291" />
      <stop offset="100%" stop-color="#e59866" />
    </linearGradient>

    <!-- تدرج اللباس (Hoodie / Veste de dev) -->
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- ماسك دائري للقص -->
    <clipPath id="circleClip">
      <circle cx="140" cy="140" r="140" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- الخلفية الدائرية -->
    <rect width="280" height="280" fill="url(#avatarBg)" />

    <!-- دائرة ضوئية جمالية فالخلف -->
    <circle cx="140" cy="140" r="115" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
    <circle cx="140" cy="140" r="128" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" />

    <!-- الجسد / الملابس (Épaules et Torse) -->
    <path d="M50 280 C50 215 85 195 140 195 C195 195 230 215 230 280 Z" fill="url(#hoodieGrad)" />
    <!-- كول التيشرت الداخلي -->
    <path d="M115 195 C115 215 140 225 140 225 C140 225 165 215 165 195 Z" fill="#0f172a" />

    <!-- العنق (Cou) -->
    <rect x="123" y="150" width="34" height="45" rx="6" fill="url(#skinGrad)" />
    <!-- ظل تحت الذقن -->
    <path d="M123 158 Q140 172 157 158 Z" fill="#cf7142" opacity="0.6" />

    <!-- الرأس والوجه (Tête / Visage) -->
    <ellipse cx="140" cy="120" rx="46" ry="52" fill="url(#skinGrad)" />

    <!-- الأذنان -->
    <circle cx="93" cy="120" r="10" fill="#e59866" />
    <circle cx="187" cy="120" r="10" fill="#e59866" />

    <!-- الشعر العصري (Coupe moderne) -->
    <path d="M92 110 C92 75 108 58 140 58 C172 58 188 75 188 110 C188 114 185 116 182 110 C175 92 165 82 140 82 C115 82 105 92 98 110 C95 116 92 114 92 110 Z" fill="#18181b" />
    <path d="M94 95 C98 72 115 62 140 62 C168 62 182 72 186 92 C178 78 162 70 140 70 C118 70 102 78 94 95 Z" fill="#27272a" />

    <!-- الحواجب -->
    <path d="M112 104 Q122 101 129 105" stroke="#18181b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M151 105 Q158 101 168 104" stroke="#18181b" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- العينان -->
    <ellipse cx="121" cy="114" rx="4.5" ry="5" fill="#18181b" />
    <circle cx="122.5" cy="112.5" r="1.5" fill="#ffffff" />
    <ellipse cx="159" cy="114" rx="4.5" ry="5" fill="#18181b" />
    <circle cx="160.5" cy="112.5" r="1.5" fill="#ffffff" />

    <!-- النظارات العصرية للبرمجة (Lunettes de dev) -->
    <rect x="108" y="106" width="26" height="18" rx="5" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <rect x="146" y="106" width="26" height="18" rx="5" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <line x1="134" y1="113" x2="146" y2="113" stroke="#0f172a" stroke-width="2.5" />
    <!-- لمعان زجاج النظارات -->
    <line x1="112" y1="120" x2="120" y2="110" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
    <line x1="150" y1="120" x2="158" y2="110" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />

    <!-- الأنف -->
    <path d="M140 118 L137 132 L143 132" stroke="#cf7142" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- اللحية المهذبة والابتسامة -->
    <path d="M131 144 Q140 150 149 144" stroke="#7c3f1d" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- لحية خفيفة على الفك -->
    <path d="M102 124 C104 154 120 168 140 168 C160 168 176 154 178 124 C178 135 174 158 164 167 C154 174 126 174 116 167 C106 158 102 135 102 124 Z" fill="#18181b" opacity="0.35" />

    <!-- الرموز البرمجية فالتأثيرات الجانبية -->
    <text x="22" y="90" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" opacity="0.4">&lt;/&gt;</text>
    <text x="238" y="180" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700" opacity="0.4">{ ; }</text>
  </g>
</svg>
