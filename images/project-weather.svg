<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <!-- خلفية النافذة العامة -->
    <linearGradient id="weatherBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>

    <!-- تدرج كارت الطقس الرئيسية (حالة مشمسة وغائمة) -->
    <linearGradient id="mainCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- تدرج قرص الشمس -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- خلفية الواجهة -->
  <rect width="640" height="400" rx="12" fill="url(#weatherBg)" />

  <!-- شريط المتصفح الفوقاني -->
  <rect width="640" height="42" rx="12" fill="#0f172a" />
  <rect y="30" width="640" height="12" fill="#0f172a" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <rect x="90" y="13" width="230" height="16" rx="4" fill="#1e293b" />

  <!-- هيدر التطبيق وشريط البحث -->
  <g transform="translate(40, 60)">
    <text x="0" y="18" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="700">WeatherPulse UI</text>
    <rect x="360" y="2" width="200" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="375" y="18" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Rechercher une ville...</text>
  </g>

  <!-- الكارت الكبيرة (الطقس الحالي لمدينة آسفي) -->
  <g transform="translate(40, 105)">
    <rect width="320" height="175" rx="10" fill="url(#mainCardGrad)" stroke="#3b82f6" stroke-width="1" />
    
    <text x="24" y="36" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Safi, Maroc</text>
    <text x="24" y="52" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="11">Aujourd'hui • Ensoleillé</text>
    
    <text x="24" y="112" fill="#ffffff" font-family="'Inter', sans-serif" font-size="44" font-weight="800">23°</text>
    
    <!-- مؤشرات إضافية: الرياح والرطوبة -->
    <rect x="24" y="132" width="130" height="26" rx="6" fill="#1e40af" opacity="0.6" />
    <text x="34" y="149" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="10">Vent: 18 km/h • Hum: 62%</text>

    <!-- رسم الشمس والسحابة -->
    <g transform="translate(200, 30)">
      <circle cx="50" cy="50" r="32" fill="url(#sunGrad)" />
      <!-- غيمة متراكبة -->
      <path d="M30 75 C30 65 38 58 48 58 C51 52 58 48 66 48 C77 48 85 55 87 64 C94 65 99 70 99 76 C99 83 93 88 85 88 L35 88 C25 88 20 81 30 75 Z" fill="#ffffff" opacity="0.9" />
    </g>
  </g>

  <!-- بطاقات المؤشرات الجانبية السريعة -->
  <g transform="translate(380, 105)">
    <!-- كارت الرطوبة ومؤشر UV -->
    <rect x="0" y="0" width="220" height="82" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">INDICE UV</text>
    <text x="16" y="54" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="20" font-weight="700">4 <tspan font-size="11" fill="#10b981">Modéré</tspan></text>
    <rect x="16" y="66" width="188" height="4" rx="2" fill="#334155" />
    <rect x="16" y="66" width="80" height="4" rx="2" fill="#10b981" />

    <!-- كارت جودة الهواء -->
    <rect x="0" y="93" width="220" height="82" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="117" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">QUALITÉ DE L'AIR</text>
    <text x="16" y="147" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="20" font-weight="700">32 <tspan font-size="11" fill="#38bdf8">Bonne (AQI)</tspan></text>
    <rect x="16" y="159" width="188" height="4" rx="2" fill="#334155" />
    <rect x="16" y="159" width="140" height="4" rx="2" fill="#38bdf8" />
  </g>

  <!-- التوقعات الأسبوعية (5 أيام في الأسفل) -->
  <g transform="translate(40, 300)">
    <!-- الإطار الخلفي للتوقعات -->
    <rect width="560" height="75" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- اليوم 1 -->
    <g transform="translate(30, 16)">
      <text x="15" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Lun</text>
      <circle cx="25" cy="30" r="7" fill="#f59e0b" />
      <text x="13" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">22°</text>
    </g>

    <!-- اليوم 2 -->
    <g transform="translate(140, 16)">
      <text x="15" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Mar</text>
      <circle cx="25" cy="30" r="7" fill="#f59e0b" />
      <text x="13" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">24°</text>
    </g>

    <!-- اليوم 3 -->
    <g transform="translate(250, 16)">
      <text x="15" y="14" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Mer</text>
      <circle cx="25" cy="30" r="7" fill="#38bdf8" />
      <text x="13" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">20°</text>
    </g>

    <!-- اليوم 4 -->
    <g transform="translate(360, 16)">
      <text x="15" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Jeu</text>
      <circle cx="25" cy="30" r="7" fill="#94a3b8" />
      <text x="13" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">19°</text>
    </g>

    <!-- اليوم 5 -->
    <g transform="translate(470, 16)">
      <text x="15" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Ven</text>
      <circle cx="25" cy="30" r="7" fill="#f59e0b" />
      <text x="13" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">23°</text>
    </g>
  </g>
</svg>
