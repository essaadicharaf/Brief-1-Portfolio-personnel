<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <!-- الخلفية الرئيسية -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- تدرج لون أزرار ولوحات الإنجاز -->
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- خلفية النافذة -->
  <rect width="640" height="400" rx="12" fill="url(#bgGrad)" />

  <!-- شريط المتصفح الفوقاني (Browser Header) -->
  <rect width="640" height="44" rx="12" fill="#1e293b" />
  <rect y="32" width="640" height="12" fill="#1e293b" />
  <circle cx="28" cy="22" r="5" fill="#ef4444" />
  <circle cx="44" cy="22" r="5" fill="#f59e0b" />
  <circle cx="60" cy="22" r="5" fill="#10b981" />
  <rect x="90" y="14" width="240" height="16" rx="4" fill="#334155" />

  <!-- السايدبار (Sidebar) -->
  <rect x="0" y="44" width="140" height="356" fill="#0f172a" opacity="0.6" />
  <rect x="18" y="70" width="104" height="12" rx="3" fill="#64748b" />
  <rect x="18" y="100" width="80" height="10" rx="3" fill="#334155" />
  <rect x="18" y="125" width="95" height="10" rx="3" fill="#334155" />
  <rect x="18" y="150" width="70" height="10" rx="3" fill="#334155" />

  <!-- هيدر الداشبورد الداخلي -->
  <text x="165" y="85" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="700">TaskFlow Dashboard</text>
  <rect x="520" y="70" width="90" height="24" rx="6" fill="url(#blueAccent)" />
  <text x="538" y="86" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">+ New Task</text>

  <!-- الكولون 1: To Do -->
  <g transform="translate(165, 110)">
    <rect width="140" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">TO DO (2)</text>

    <!-- Task Item 1 -->
    <rect x="10" y="40" width="120" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="52" width="60" height="8" rx="2" fill="#e2e8f0" />
    <rect x="20" y="66" width="100" height="6" rx="2" fill="#64748b" />
    <rect x="20" y="92" width="36" height="14" rx="3" fill="#ef4444" opacity="0.2" />
    <text x="24" y="102" fill="#f87171" font-family="'Inter', sans-serif" font-size="8" font-weight="600">URGENT</text>

    <!-- Task Item 2 -->
    <rect x="10" y="125" width="120" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="137" width="75" height="8" rx="2" fill="#e2e8f0" />
    <rect x="20" y="151" width="90" height="6" rx="2" fill="#64748b" />
    <rect x="20" y="167" width="30" height="14" rx="3" fill="#3b82f6" opacity="0.2" />
    <text x="24" y="177" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="8" font-weight="600">FRONT</text>
  </g>

  <!-- الكولون 2: In Progress -->
  <g transform="translate(320, 110)">
    <rect width="140" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="24" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="12" font-weight="600">IN PROGRESS (1)</text>

    <!-- Task Item Active -->
    <rect x="10" y="40" width="120" height="85" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="20" y="52" width="80" height="8" rx="2" fill="#f8fafc" />
    <rect x="20" y="66" width="100" height="6" rx="2" fill="#64748b" />
    <rect x="20" y="78" width="70" height="6" rx="2" fill="#64748b" />
    <!-- Progress Bar -->
    <rect x="20" y="102" width="100" height="4" rx="2" fill="#334155" />
    <rect x="20" y="102" width="65" height="4" rx="2" fill="#3b82f6" />
  </g>

  <!-- الكولون 3: Done -->
  <g transform="translate(475, 110)">
    <rect width="140" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="24" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600">DONE (3)</text>

    <!-- Task Item Completed -->
    <rect x="10" y="40" width="120" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.7" />
    <rect x="20" y="52" width="70" height="8" rx="2" fill="#94a3b8" />
    <circle cx="112" cy="56" r="6" fill="#10b981" />
    <path d="M109 56 L111 58 L115 54" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <rect x="20" y="66" width="90" height="6" rx="2" fill="#475569" />

    <!-- Task Item Completed 2 -->
    <rect x="10" y="115" width="120" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.7" />
    <rect x="20" y="127" width="85" height="8" rx="2" fill="#94a3b8" />
    <circle cx="112" cy="131" r="6" fill="#10b981" />
    <path d="M109 131 L111 133 L115 129" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <rect x="20" y="141" width="75" height="6" rx="2" fill="#475569" />
  </g>
</svg>
